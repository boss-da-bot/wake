name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build universal app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Wake.xcodeproj \
            -scheme Wake \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64" \
            build

      - name: Package unsigned app
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Wake.app"
          test -d "$APP"
          lipo -info "$APP/Contents/MacOS/Wake"
          # Confirm the bundle does not advertise a screen-capture permission.
          if plutil -p "$APP/Contents/Info.plist" | grep -q NSScreenCaptureUsageDescription; then
            echo "Info.plist must not request screen capture" >&2
            exit 1
          fi
          mkdir -p dist
          ditto -c -k --keepParent "$APP" dist/Wake-unsigned.zip

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: Wake-macos-unsigned
          path: dist/Wake-unsigned.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Wake-unsigned.zip
          generate_release_notes: true
